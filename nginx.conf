user www-data;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type  application/octet-stream;

    types {
        application/javascript js mjs;
        text/css css;
        image/svg+xml svg;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss text/javascript image/svg+xml font/woff2;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_disable "msie6";

    server {
        listen 80;
        return 301 https://activos-ti.mineco.gob.gt$request_uri;
    }

    server {
	listen 443 ssl;
	server_name  activos-ti.mineco.gob.gt;

	ssl_certificate /etc/ssl/private/mineco.crt;
	ssl_certificate_key /etc/ssl/private/mineco.key;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
	ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        root /var/www/html/public;
        index index.php index.html;

        error_page 404 /index.php;

        location /build/ {
            try_files $uri =404;
        }

        location ~ /\.ht {
            deny all;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        client_max_body_size 20M;

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
